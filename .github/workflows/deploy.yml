# Build handbook dan terbitkan ke GitHub Pages (branch gh-pages)
# setiap ada push ke branch main.
name: Deploy handbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Situs proyek GitHub Pages berada di subfolder bernama repo, mis. /WareHouse/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Terbitkan ke branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          force_orphan: true
          commit_message: 'Deploy handbook dari ${{ github.sha }}'
